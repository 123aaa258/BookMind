name: BookMind CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Build & Test (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Run frontend unit tests (Vitest)
        run: npm test

      - name: Build production static bundle
        run: npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  backend:
    name: Backend Build, Checkstyle, Enforcer & Tests (Java 21)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Download frontend dist into Spring Boot static resources
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: book-server/src/main/resources/static

      - name: Run Maven verify (compile, unit tests, Checkstyle, Enforcer, Shade plugin JAR)
        run: mvn -B verify

      - name: Verify independent PDF plugin build command (without building book-server/book-rag)
        run: mvn -B -pl book-plugin-pdf -am package
